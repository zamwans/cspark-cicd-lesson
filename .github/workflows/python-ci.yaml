name : Python CI

on: [push, workflow_dispatch]

jobs:
  PythonVersionSetUp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.x'
      - run: python --version
      - run: pip --version
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov poetry
      - name: Run Tests
        working-directory: my_package
        run: pytest tests/ --doctest-modules --junitxml=junit/test-results.xml --cov=app_zamwans --cov-report=xml --cov-report=html

      - name: Build
        working-directory: my_package
        run: poetry build
  PublishPackage:
    runs-on: ubuntu-latest
    needs: PythonVersionSetUp
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.x'
      - run: python --version
      - run: pip --version
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
      - name: Build
        working-directory: my_package
        run: poetry build
      - name: Publish
        working-directory: my_package
        run: |
          poetry config repositories.cspark https://gitlab.com/api/v4/projects/61532089/packages/pypi
          poetry config http-basic.cspark cspark_user  ${{ secrets.PYPI_TOKEN }}
          poetry publish -r cspark
